name: CI + Auto Merge

on:
  pull_request:
    branches:
      - master

  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run test
        run: |
          echo "Running tests..."
          sleep 10
          echo "Test PASS"

  auto-merge:
    name: Enable Auto Merge
    needs: test

    # Chỉ bật auto-merge khi workflow chạy từ PR
    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    steps:
      - name: Enable auto merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" \
            --auto \
            --squash
