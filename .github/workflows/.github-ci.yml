name: CI + Auto Merge

on:
  push:
    branches-ignore:
      - master

  pull_request:
    branches:
      - master

  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run test
        run: |
          echo "Running tests..."
          sleep 10
          echo "Test PASS"

  create-pull-request:
    name: Create Pull Request
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Create pull request when tests pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          open_prs=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH_NAME" \
            --base master \
            --state open \
            --json number \
            --jq 'length')

          if [ "$open_prs" -eq 0 ]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base master \
              --head "$BRANCH_NAME" \
              --title "${BRANCH_NAME}: automated pull request" \
              --body "Tests passed in CI. This pull request is ready for the merge queue."
          else
            echo "An open pull request already exists for $BRANCH_NAME."
          fi

  auto-merge:
    name: Enable Auto Merge
    needs: test

    # Chỉ bật auto-merge khi workflow chạy từ PR
    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    steps:
      - name: Enable auto merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" \
            --auto \
            --squash
