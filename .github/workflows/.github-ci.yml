name: CI for Merge Queue

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

  merge_group:
    types:
      - checks_requested

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merge group
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          echo "Testing $GITHUB_SHA"
          echo "Running tests..."
          sleep 10
          echo "Test PASS"

  enqueue:
    name: Add PR to Merge Queue
    needs: test
    if: github.event_name == 'pull_request' && needs.test.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash
